name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zelesny-com
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=

      # No layer caching on this build. `cache-to: type=gha,mode=max` exports
      # every intermediate layer -- including the build stage holding the
      # rendered /gift page. On a public repository anyone who can open a pull
      # request can read those caches, and Actions caches have no visibility
      # setting. See docs/plans/2026-09-10-001-feat-ugift-contribution-page-plan.md.
      # Do not re-add cache-from/cache-to here.
      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          GIFT_DATA: ${{ secrets.GIFT_DATA }}
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-envs: |
            gift_data=GIFT_DATA
